<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Agentic Enterprise Workflows"><rect width="1200" height="270" fill="#14213D"/><rect y="263" width="1200" height="7" fill="#2E8B67"/><line x1="44" y1="0" x2="44" y2="263" stroke="#C4524A" stroke-width="1.5"/><line x1="50" y1="0" x2="50" y2="263" stroke="#C4524A" stroke-width="1.5"/><text x="76" y="52" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="15" fill="#7FCFAE">Prototype / Agentic AI on synthetic data</text><text x="76" y="104" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="42" font-weight="700" fill="#F8F9F7">Agentic Enterprise Workflows</text><text x="76" y="140" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="19" fill="#C9CFDA">One policy-agnostic agent engine running three industry workflows as configuration.</text><line x1="76" y1="154" x2="1156" y2="154" stroke="#33466F" stroke-width="1"/><text x="76" y="200" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="30" font-weight="700" fill="#F8F9F7">3 workflows</text><text x="76" y="224" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#A9B4CB">deductions, collections, invoice exceptions</text><line x1="418" y1="172" x2="418" y2="230" stroke="#33466F" stroke-width="1"/><text x="436" y="200" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="23" font-weight="700" fill="#F8F9F7">Citation rule</text><text x="436" y="224" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#A9B4CB">no automatic decision without a retrieved clause</text><line x1="778" y1="172" x2="778" y2="230" stroke="#33466F" stroke-width="1"/><text x="796" y="200" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="30" font-weight="700" fill="#F8F9F7">10 tests</text><text x="796" y="224" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#A9B4CB">design rules enforced as tests</text></svg>
